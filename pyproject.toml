[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogentzen-studio"
version = "0.1.0"
description = "Local neuro-symbolic dataset studio: documents -> knowledge graph -> nanoGentzen-verified ClearCoT (SFT/DPO) and Jev decision datasets"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Andrija Sagicc" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core runtime: the nanoGentzen v4 engine runs on its NumPy or symbolic backend without torch.
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.3",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "tqdm>=4.66.0",
    "safetensors>=0.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pillow>=10.0",
    "networkx>=3.2",
    "pyvis>=0.3.2",
]

[project.optional-dependencies]
# torch backend for nanoGentzen v4 (CUDA: install torch from https://pytorch.org first)
torch = ["torch>=2.2.0", "transformers>=4.40.0"]
# local vLLM server (Linux + NVIDIA); on Windows use Ollama / LM Studio or vLLM inside WSL2
vllm = ["vllm>=0.4.0"]
layout = ["surya-ocr"]
kg = ["knwler"]
exact-erf = ["scipy"]

[project.urls]
"nanoGentzen v3 (earlier release; v4 ships in model/)" = "https://huggingface.co/Sagicc/nanoGentzen-v3"
"Occam CCoT reasoner" = "https://huggingface.co/Sagicc/Occam-2B-CCoT"
"ClearCoT paper" = "https://doi.org/10.5281/zenodo.19409889"

[tool.setuptools]
# the Studio is run from a checkout (streamlit run app.py); packages listed for editable installs
packages = { find = { include = ["core*", "gui*", "llm_backend*", "nanogentzen*", "nanogentzen_v4*"] } }
py-modules = ["config", "app"]

[tool.setuptools.package-data]
nanogentzen = ["*.json"]
nanogentzen_v4 = ["*.json", "*.md"]
